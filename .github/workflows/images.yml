name: images

# Builds the three agent-free base images for linux/amd64 and linux/arm64 and
# pushes them to GHCR:
#   tag push vX.Y.Z  → ghcr.io/dailybothq/devcontainer-kit-base:<flavour>-vX.Y.Z
#   nightly / manual → ghcr.io/dailybothq/devcontainer-kit-base:<flavour>-nightly
# Release tags are what templates pin (by digest); nightly rebuilds pick up
# base-image security updates and surface drift without moving a release.
# Every digest is written to the job summary and uploaded as an artifact.
# Third-party actions are pinned by commit SHA.

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.flavour }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        flavour: [python-3.13, node-24, debian]
    env:
      IMAGE: ghcr.io/dailybothq/devcontainer-kit-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "suffix=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=nightly" >> "$GITHUB_OUTPUT"
            echo "version=$(cat VERSION)-nightly" >> "$GITHUB_OUTPUT"
          fi
      - name: static image checks
        run: bash tests/run.sh images
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.flavour }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            DCK_VERSION=${{ steps.tag.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ matrix.flavour }}-${{ steps.tag.outputs.suffix }}
      - name: record digest
        env:
          FLAVOUR: ${{ matrix.flavour }}
          SUFFIX: ${{ steps.tag.outputs.suffix }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          line="${IMAGE}:${FLAVOUR}-${SUFFIX}@${DIGEST}"
          echo "$line" > "digest-${FLAVOUR}.txt"
          echo "- \`$line\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.flavour }}
          path: digest-${{ matrix.flavour }}.txt
