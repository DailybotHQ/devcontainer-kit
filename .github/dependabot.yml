# Dependabot: GitHub Actions only. The repository has no package-manager dependencies
# (bash + python3 standard library); the images' inputs are pinned by version, digest and
# SHA-256 in images/versions.env and bumped deliberately (see docs/images.md), because a
# pin change also needs new checksums that Dependabot cannot produce.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: ["dependencies"]
