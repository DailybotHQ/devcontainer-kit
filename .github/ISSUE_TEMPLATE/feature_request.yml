name: Feature request
description: Propose a change to dck, the template, the images or the docs.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like dck to do? Consider the security defaults (loopback ports, agent forwarding, no bypass flags) in docs/SECURITY.md.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
